<main class="container py-4">
  <h1 class="h3 mb-4">Catálogo de Livros</h1>
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>Código</th>
          <th>Título</th>
          <th>Resumo</th>
          <th>Editora</th>
          <th>Autores</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let livro of livros">
          <td>{{ livro.codigo }}</td>
          <td class="fw-semibold">{{ livro.titulo }}</td>
          <td>{{ livro.resumo }}</td>
          <td>{{ obterNome(livro.codEditora) }}</td>
          <td>
            <ul class="mb-0 ps-3">
              <li *ngFor="let autor of livro.autores">{{ autor }}</li>
            </ul>
          </td>
          <td class="text-end">
            <button type="button" class="btn btn-danger btn-sm" (click)="excluir(livro.codigo)">Excluir</button>
          </td>
        </tr>
        <tr *ngIf="livros.length === 0">
          <td colspan="6" class="text-center text-muted py-4">Nenhum livro cadastrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
