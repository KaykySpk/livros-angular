<main class="container py-4">
  <h1 class="h3 mb-4">Cadastro de Livro</h1>
  <form class="card card-body shadow-sm" (submit)="incluir()" ngNativeValidate>
    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" id="titulo" name="titulo" class="form-control"
             [(ngModel)]="livro.titulo" required>
    </div>
    <div class="mb-3">
      <label for="resumo" class="form-label">Resumo</label>
      <textarea id="resumo" name="resumo" class="form-control" rows="3"
                [(ngModel)]="livro.resumo"></textarea>
    </div>
    <div class="mb-3">
      <label for="editora" class="form-label">Editora</label>
      <select id="editora" name="editora" class="form-select"
              [(ngModel)]="livro.codEditora" required>
        <option value="" disabled [selected]="livro.codEditora === 0">Selecione uma editora</option>
        <option *ngFor="let editora of editoras" [ngValue]="editora.codEditora">{{ editora.nome }}</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="autores" class="form-label">Autores (um por linha)</label>
      <textarea id="autores" name="autores" class="form-control" rows="3"
                [(ngModel)]="autoresForm"></textarea>
    </div>
    <div>
      <button type="submit" class="btn btn-primary">Salvar Dados</button>
    </div>
  </form>
</main>
